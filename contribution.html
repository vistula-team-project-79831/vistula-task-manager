<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
      line-height: 1.5;
    }
    button {
      font: inherit;
      padding: 6px 12px;
      cursor: pointer;
    }
    .error {
      color: #cf222e;
    }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>

  <button type="button" id="load-contributor">Show Contributor</button>

  <p>Contributor Student ID: <strong id="contributor-student-id"></strong></p>
  <p id="contributor-error" class="error"></p>

  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    const button = document.getElementById("load-contributor");
    const output = document.getElementById("contributor-student-id");
    const errorMessage = document.getElementById("contributor-error");

    button.addEventListener("click", async () => {
      errorMessage.textContent = "";
      try {
        const response = await fetch("contribution.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        if (!data.contributorStudentId) {
          throw new Error("contributorStudentId is missing in contribution.json");
        }
        output.textContent = data.contributorStudentId;
      } catch (error) {
        output.textContent = "";
        errorMessage.textContent = `Could not load contributor: ${error.message}`;
      }
    });
  </script>
</body>
</html>
